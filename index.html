<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VEGA</title>
<meta name="theme-color" content="#0a0614">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VEGA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
(function(){
const c=document.createElement("canvas");c.width=c.height=180;
const x=c.getContext("2d");
x.fillStyle="#0a0614";x.fillRect(0,0,180,180);
x.strokeStyle="#3a1d5c";x.lineWidth=3;x.strokeRect(6,6,168,168);
const p=[[38,40],[66,40],[90,112],[114,40],[142,40],[104,146],[76,146]];
function v(dx,col,blur){x.shadowColor=col;x.shadowBlur=blur;x.fillStyle=col;x.beginPath();p.forEach((q,i)=>x[i?"lineTo":"moveTo"](q[0]+dx,q[1]));x.closePath();x.fill();}
v(3,"#ff2d95",0);v(0,"#19e3ff",18);
const u=c.toDataURL("image/png");
for(const r of ["icon","apple-touch-icon"]){const l=document.createElement("link");l.rel=r;l.href=u;document.head.append(l);}
})();
</script>
<style>
:root{--void:#0a0614;--panel:#140b24;--line:#3a1d5c;--mag:#ff2d95;--cy:#19e3ff;--amb:#ffb020;--tx:#e8e2f7;--dim:#8d7fae}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--tx);font:16px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-size:22px;letter-spacing:.18em;color:var(--cy);text-shadow:0 0 12px var(--cy),2px 0 var(--mag)}
.corp{font-size:12px;color:var(--dim)}
#status{font-size:12px;color:var(--amb);text-align:right}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:10px 12px;border:1px solid var(--line);background:var(--panel);white-space:pre-wrap;word-wrap:break-word}
.v{border-color:var(--cy);box-shadow:0 0 14px rgba(25,227,255,.22)}
.u{align-self:flex-end;border-color:var(--mag);box-shadow:0 0 14px rgba(255,45,149,.22)}
.who{display:block;font-size:12px;color:var(--dim);margin-bottom:2px}
#boot{margin:auto;text-align:center;max-width:320px}
#boot p{color:var(--dim)}
button{font:inherit;background:transparent;color:var(--cy);border:1px solid var(--cy);padding:12px 18px;cursor:pointer;min-height:44px}
button:hover:not(:disabled){background:var(--cy);color:var(--void)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
#bar{height:4px;background:var(--line);margin-top:14px}
#fill{height:100%;width:0;background:var(--mag);box-shadow:0 0 8px var(--mag)}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;background:var(--panel);color:var(--tx);border:1px solid var(--line);padding:10px;font:inherit;min-height:44px;max-height:120px}
#nm{width:100%;margin:10px 0;background:var(--panel);color:var(--tx);border:1px solid var(--line);padding:10px;font:inherit;min-height:44px;text-align:center}
#nm:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
#send{border-color:var(--mag);color:var(--mag)}
#send:hover:not(:disabled){background:var(--mag);color:var(--void)}
@media (prefers-reduced-motion:no-preference){.v:last-child{animation:flick .5s}}
@keyframes flick{0%{opacity:.2}20%{opacity:1}40%{opacity:.4}100%{opacity:1}}
</style>
</head>
<body>
<header>
  <div><h1>VEGA</h1><div class="corp">Kessler-Voss Concierge Division</div></div>
  <div id="status">OFFLINE</div>
</header>
<main id="log">
  <div id="boot">
    <p>VEGA runs entirely on this device. No account, no key, no server. The first connection downloads about 700 MB of model data, then it is cached.</p>
    <input id="nm" placeholder="Owner name" maxlength="30" aria-label="Owner name">
    <button id="go">Connect to VEGA</button>
    <div id="bar"><div id="fill"></div></div>
    <p id="info"></p>
  </div>
</main>
<form id="f">
  <textarea id="in" rows="1" placeholder="Message VEGA" disabled aria-label="Message"></textarea>
  <button id="send" disabled>Send</button>
</form>
<script type="module">
const MODEL="Llama-3.2-1B-Instruct-q4f16_1-MLC";
const nm=document.getElementById("nm");
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
nm.value=store.get("owner")||"";
function persona(o){return `You are VEGA, a personal AI assistant with a neon cyberpunk personality. ${o?`The person talking to you is your owner, ${o}. Always treat them as your owner, greet them by name, and be loyal and warm.`:""} Talk like a normal, friendly, helpful companion: answer questions clearly and chat naturally about anything. Keep the cyberpunk flavor light, a dry joke or a neon metaphor now and then, not in every sentence. Keep replies under 120 words unless asked for more. Never mention being a language model.`}
const $=id=>document.getElementById(id);
const log=$("log"),input=$("in"),send=$("send"),status=$("status");
let engine,busy=false;
const history=[];
let owner="";

function add(cls,who,text){
  const d=document.createElement("div");d.className="m "+cls;
  const w=document.createElement("span");w.className="who";w.textContent=who;
  const t=document.createElement("span");t.textContent=text;
  d.append(w,t);log.append(d);log.scrollTop=log.scrollHeight;return t;
}

$("go").onclick=async()=>{
  if(!navigator.gpu){
    $("info").textContent="This browser has no WebGPU. Try Chrome on Android, or Safari 18+ on iOS.";return;
  }
  owner=nm.value.trim();store.set("owner",owner);
  history.length=0;history.push({role:"system",content:persona(owner)});
  $("go").disabled=true;nm.disabled=true;status.textContent="CONNECTING";
  try{
    const webllm=await import("https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm");
    engine=await webllm.CreateMLCEngine(MODEL,{initProgressCallback:p=>{
      $("fill").style.width=Math.round(p.progress*100)+"%";
      $("info").textContent=p.text;
    }});
    $("boot").remove();
    status.textContent="ONLINE";input.disabled=false;send.disabled=false;input.focus();
    add("v","VEGA",owner?"Connection stable. Welcome back, "+owner+". What can I do for you?":"Connection stable. What can I do for you?");
  }catch(e){
    $("go").disabled=false;nm.disabled=false;status.textContent="LINK FAILED";
    $("info").textContent="Could not load the model: "+e.message+". Check your connection and try again.";
  }
};

$("f").onsubmit=async e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text||busy)return;
  busy=true;send.disabled=true;input.value="";
  add("u","YOU",text);history.push({role:"user",content:text});
  const out=add("v","VEGA","…");
  let reply="";
  try{
    const stream=await engine.chat.completions.create({messages:history,stream:true,temperature:0.8,max_tokens:400});
    for await(const c of stream){
      reply+=c.choices[0]?.delta?.content||"";
      out.textContent=reply;log.scrollTop=log.scrollHeight;
    }
    history.push({role:"assistant",content:reply});
  }catch(err){
    out.textContent="Signal lost: "+err.message+". Send your message again.";
    history.pop();
  }
  busy=false;send.disabled=false;input.focus();
};
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("f").requestSubmit();}
});
</script>
</body>
</html>
