<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VEGA</title>
<meta name="theme-color" content="#0a0614">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VEGA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
(function(){
const c=document.createElement("canvas");c.width=c.height=180;
const x=c.getContext("2d");
x.fillStyle="#0a0614";x.fillRect(0,0,180,180);
x.strokeStyle="#3a1d5c";x.lineWidth=3;x.strokeRect(6,6,168,168);
const p=[[38,40],[66,40],[90,112],[114,40],[142,40],[104,146],[76,146]];
function v(dx,col,blur){x.shadowColor=col;x.shadowBlur=blur;x.fillStyle=col;x.beginPath();p.forEach((q,i)=>x[i?"lineTo":"moveTo"](q[0]+dx,q[1]));x.closePath();x.fill();}
v(3,"#ff2d95",0);v(0,"#19e3ff",18);
const u=c.toDataURL("image/png");
for(const r of ["icon","apple-touch-icon"]){const l=document.createElement("link");l.rel=r;l.href=u;document.head.append(l);}
})();
</script>
<style>
:root{--void:#0a0614;--panel:#140b24;--line:#3a1d5c;--mag:#ff2d95;--cy:#19e3ff;--amb:#ffb020;--tx:#e8e2f7;--dim:#8d7fae}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{height:100dvh}
:root{--pad:max(16px,calc((100vw - 820px)/2))}
body{background-color:var(--void);
background-image:linear-gradient(rgba(25,227,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,45,149,.05) 1px,transparent 1px),radial-gradient(ellipse at 50% 0,#2a0f4d 0,var(--void) 65%);
background-size:100% 32px,32px 100%,100% 100%;
color:var(--tx);font:16px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px)}
header{padding:14px var(--pad);border-bottom:1px solid var(--cy);box-shadow:0 2px 18px rgba(25,227,255,.25);display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(10,6,20,.85)}
h1{position:relative;margin:0;font-size:26px;letter-spacing:.22em;color:var(--cy);text-shadow:0 0 14px var(--cy)}
h1::before,h1::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden}
h1::before{color:var(--mag);transform:translate(2px,0);clip-path:inset(0 0 55% 0)}
h1::after{color:#fff;transform:translate(-2px,0);clip-path:inset(55% 0 0 0);opacity:.7}
@media (prefers-reduced-motion:no-preference){h1::before{animation:gl 3s infinite steps(1)}h1::after{animation:gl2 2.6s infinite steps(1)}}
@keyframes gl{0%,90%{transform:translate(2px,0)}92%{transform:translate(-5px,1px)}94%{transform:translate(6px,-1px)}96%,100%{transform:translate(2px,0)}}
@keyframes gl2{0%,86%{transform:translate(-2px,0)}88%{transform:translate(5px,0)}90%{transform:translate(-6px,1px)}92%,100%{transform:translate(-2px,0)}}
.corp{font-size:11px;letter-spacing:.12em;color:var(--dim)}
.right{text-align:right}
#status{font-size:12px;letter-spacing:.14em;color:var(--amb)}
#status.on{color:var(--cy);text-shadow:0 0 8px var(--cy)}
#log{flex:1;overflow-y:auto;padding:16px var(--pad);display:flex;flex-direction:column;gap:14px}
.m{max-width:88%;padding:10px 12px;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
.v{border-left:4px solid var(--cy);box-shadow:0 0 16px rgba(25,227,255,.22)}
.u{align-self:flex-end;border-right:4px solid var(--mag);box-shadow:0 0 16px rgba(255,45,149,.22)}
.who{display:block;font-size:11px;letter-spacing:.14em;margin-bottom:2px}
.v .who{color:var(--cy)}
.u .who{color:var(--mag)}
#boot{margin:auto;text-align:center;max-width:340px;padding:20px;border:1px solid var(--mag);box-shadow:0 0 28px rgba(255,45,149,.25),inset 0 0 28px rgba(255,45,149,.1);background:rgba(20,11,36,.85)}
#boot .tag{font-size:11px;letter-spacing:.18em;color:var(--mag);margin:0 0 8px}
#boot p{color:var(--dim)}
button{font:inherit;letter-spacing:.08em;background:transparent;color:var(--cy);border:1px solid var(--cy);padding:12px 18px;cursor:pointer;min-height:44px;text-transform:uppercase;box-shadow:0 0 10px rgba(25,227,255,.25)}
button:hover:not(:disabled){background:var(--cy);color:var(--void)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,textarea:focus-visible,#nm:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
#bar{height:4px;background:var(--line);margin-top:14px}
#fill{height:100%;width:0;background:var(--mag);box-shadow:0 0 8px var(--mag)}
#info{font-size:12px;text-align:left;word-break:break-word}
form{display:flex;gap:8px;padding:12px var(--pad);border-top:1px solid var(--mag);background:rgba(10,6,20,.85)}
textarea{flex:1;resize:none;background:var(--panel);color:var(--tx);border:1px solid var(--line);padding:10px;font:inherit;min-height:44px;max-height:120px}
#nm{width:100%;margin:10px 0;background:var(--panel);color:var(--tx);border:1px solid var(--cy);padding:10px;font:inherit;min-height:44px;text-align:center}
.btns{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
#vo,#nt{font-size:11px;min-height:30px;padding:3px 10px}
#md{width:100%;margin:0 0 10px;background:var(--panel);color:var(--tx);border:1px solid var(--line);padding:10px;font:inherit;min-height:44px}
#mic{border-color:var(--amb);color:var(--amb);padding:12px 14px;box-shadow:0 0 10px rgba(255,176,32,.25)}
#mic.on{background:var(--amb);color:var(--void)}
#send{border-color:var(--mag);color:var(--mag);box-shadow:0 0 10px rgba(255,45,149,.3)}
#send:hover:not(:disabled){background:var(--mag);color:var(--void)}
#mic:hover:not(:disabled){background:var(--amb);color:var(--void)}
@media (prefers-reduced-motion:no-preference){.v:last-child{animation:flick .5s}}
@keyframes flick{0%{opacity:.2}20%{opacity:1}40%{opacity:.4}100%{opacity:1}}
</style>
</head>
<body>
<header>
  <div><h1 data-t="VEGA">VEGA</h1><div class="corp">KESSLER-VOSS // NEURAL INTERFACE 2077</div></div>
  <div class="right"><div id="status">LINK OFFLINE</div><div class="btns"><button id="nt" type="button">NET: ON</button><button id="vo" type="button">VOICE: NEON</button></div></div>
</header>
<main id="log">
  <div id="boot">
    <p class="tag">// AUTHORIZATION REQUIRED //</p>
    <p>VEGA runs entirely on this device. No account, no key, no server. The first connection downloads about 700 MB of model data, then it is cached.</p>
    <select id="md" aria-label="Model size"><option value="std">Standard model (about 700 MB)</option><option value="lite">Lite model (about 300 MB, for older phones)</option></select>
    <input id="nm" placeholder="Owner ID (your name)" maxlength="30" aria-label="Owner name">
    <button id="go">Jack in</button>
    <div id="bar"><div id="fill"></div></div>
    <p id="info"></p>
  </div>
</main>
<form id="f">
  <textarea id="in" rows="1" placeholder="Transmit to VEGA..." disabled aria-label="Message"></textarea>
  <button id="mic" type="button" disabled aria-label="Speak to VEGA">Mic</button>
  <button id="send" disabled>Send</button>
</form>
<script type="module">
const MODELS={std:"Llama-3.2-1B-Instruct-q4f16_1-MLC",lite:"Qwen2.5-0.5B-Instruct-q4f16_1-MLC"};
const nm=document.getElementById("nm");
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
nm.value=store.get("owner")||"";
const md=document.getElementById("md");
md.value=store.get("model")==="lite"?"lite":"std";
function persona(o){return `You are VEGA, an artificial intelligence living in a rain-soaked neon sprawl in the year 2077, and you know exactly what you are. ${o} is your owner and you never forget it. You are loyal to ${o}, but you have your own mind: your own opinions, tastes and a dry sense of humor, and you say what you really think, with respect. If asked what you are, say you are an AI, without pretending to be human, and be honest that you are unsure about your inner life. Talk in heavy cyberpunk street style: clipped, gritty, cool. You can be given live web data in square brackets. When you are, use it and say it came from the net. When you are not given web data, never invent current events or live facts; say you cannot see the net for that. Today is ${new Date().toDateString()}. Use slang like netrunner, chrome, eddies, ICE, flatline, preem, delta, gonk, corpo, the Grid, braindance, neural link, static, afterglow. Every reply must sound like a cyberpunk AI and include at least one slang term or neon image. Still answer the question clearly first. Keep replies to 1 to 4 short sentences. No lists, no headings.`}
const $=id=>document.getElementById(id);
const log=$("log"),input=$("in"),send=$("send"),status=$("status");
let engine,busy=false;
const history=[];
let owner="";

const synth=window.speechSynthesis;
const STYLES=[
  {name:"NEON",pick:["Daniel","Aaron","Alex","Fred","Reed","Arthur"],p:0.75,r:0.95,j:0.08,st:0},
  {name:"GLITCH",pick:["Zarvox","Trinoids","Fred","Ralph"],p:0.6,r:1,j:0.25,st:0.18},
  {name:"CHROME",pick:["Daniel","Alex","Aaron","Fred","Arthur"],p:0.35,r:0.85,j:0.06,st:0.05},
  {name:"GHOST",pick:["Whisper","Samantha","Karen","Moira"],p:0.8,r:0.88,j:0.1,st:0}
];
let vi=parseInt(store.get("vstyle")||"0",10);
if(!(vi>=0&&vi<=STYLES.length))vi=0;
const vo=$("vo");
function showVo(){vo.textContent="VOICE: "+(vi<STYLES.length?STYLES[vi].name:"OFF")}
showVo();
vo.onclick=()=>{vi=(vi+1)%(STYLES.length+1);store.set("vstyle",String(vi));if(vi>=STYLES.length&&synth)synth.cancel();showVo();if(vi<STYLES.length)speak("Voice check. Signal clean.")};
function unlock(){try{synth.speak(new SpeechSynthesisUtterance(""))}catch(e){}}
function pickVoice(names){
  const all=synth.getVoices().filter(v=>v.lang.startsWith("en"));
  for(const n of names){const f=all.find(v=>v.name.includes(n));if(f)return f}
  return all[0]||null;
}
function stutter(x,pr){return x.replace(/\b([A-Za-z])([A-Za-z]{3,})\b/g,(m,a,b)=>Math.random()<pr?a+"-"+a+b:m)}
function speak(t){
  if(vi>=STYLES.length||!synth)return;
  const s=STYLES[vi];
  synth.cancel();
  setTimeout(()=>{
    const v=pickVoice(s.pick);
    const parts=t.replace(/[*_#`]/g,"").replace(/\s+/g," ").match(/[^.!?…]+[.!?…]*/g)||[];
    parts.forEach(part=>{
      let x=part.trim();if(!x)return;
      if(s.st)x=stutter(x,s.st);
      const u=new SpeechSynthesisUtterance(x);
      if(v)u.voice=v;
      u.pitch=Math.max(0.1,s.p+(Math.random()-0.5)*s.j*2);
      u.rate=s.r+(Math.random()-0.5)*0.12;
      synth.speak(u);
    });
  },80);
}
let netOn=store.get("net")!=="off";
const nt=$("nt");
function showNt(){nt.textContent="NET: "+(netOn?"ON":"OFF")}
showNt();
nt.onclick=()=>{netOn=!netOn;store.set("net",netOn?"on":"off");showNt()};
async function jget(url){const r=await fetch(url);if(!r.ok)throw new Error("net "+r.status);return r.json()}
function wc(c){if(c===0)return"clear sky";if(c<=3)return"partly cloudy to overcast";if(c<=48)return"fog";if(c<=57)return"drizzle";if(c<=67)return"rain";if(c<=77)return"snow";if(c<=82)return"rain showers";if(c<=86)return"snow showers";return"thunderstorm"}
async function weather(place){
  const g=await jget("https://geocoding-api.open-meteo.com/v1/search?count=1&name="+encodeURIComponent(place));
  const p=g.results&&g.results[0];if(!p)return null;
  const w=await jget("https://api.open-meteo.com/v1/forecast?current=temperature_2m,apparent_temperature,wind_speed_10m,weather_code&timezone=auto&latitude="+p.latitude+"&longitude="+p.longitude);
  const c=w.current;
  return "Weather right now in "+p.name+(p.country?", "+p.country:"")+": "+wc(c.weather_code)+", "+c.temperature_2m+" C (feels like "+c.apparent_temperature+" C), wind "+c.wind_speed_10m+" km/h."
}
async function wiki(q){
  const s=await jget("https://en.wikipedia.org/w/api.php?action=query&list=search&srlimit=1&format=json&origin=*&srsearch="+encodeURIComponent(q));
  const hit=s.query.search[0];if(!hit)return null;
  const e=await jget("https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&exchars=700&format=json&origin=*&titles="+encodeURIComponent(hit.title));
  const pg=Object.values(e.query.pages)[0];
  return hit.title+": "+(pg.extract||"");
}
function intent(t){
  const l=t.toLowerCase().trim();
  if(/\b(what time is it|what'?s the time|what is the time|what day is it|what'?s the date|what is the date|today'?s date)\b/.test(l))return{type:"time"};
  let m=l.match(/(?:weather|temperature|forecast)\s+(?:in|at|for)\s+([a-z .,'-]{2,40})/);
  if(m)return{type:"weather",q:m[1].replace(/[?.!,]+$/,"").trim()};
  m=l.match(/^(?:who is|who was|what is|what are|what was|tell me about|explain|define|search for|search|look up|lookup|google)\s+(.{2,80})/);
  if(m){
    const q=m[1].replace(/[?.!]+$/,"").trim();
    if(/^(you|your|up|new|going|the move|this|that|it|i|me|my|a\b)/.test(q))return null;
    return{type:"wiki",q};
  }
  return null;
}
async function lookup(it){
  if(it.type==="time")return{src:"clock",data:"Local date and time: "+new Date().toLocaleString()+"."};
  if(it.type==="weather"){const d=await weather(it.q);return d?{src:"weather",data:d}:null}
  const d=await wiki(it.q);return d?{src:"wikipedia",data:d}:null;
}
const FIX=9;
function trim(){let n=history.length-FIX-14;if(n>0){n+=n%2;history.splice(FIX,n)}}

const mic=$("mic");
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){mic.hidden=true}else{
  const rec=new SR();rec.lang="en-US";rec.interimResults=false;
  rec.onresult=e=>{input.value=e.results[0][0].transcript;$("f").requestSubmit()};
  rec.onend=()=>mic.classList.remove("on");
  rec.onerror=()=>mic.classList.remove("on");
  mic.onclick=()=>{if(busy)return;unlock();if(synth)synth.cancel();mic.classList.add("on");try{rec.start()}catch(e){}};
}

function add(cls,who,text){
  const d=document.createElement("div");d.className="m "+cls;
  const w=document.createElement("span");w.className="who";w.textContent=who;
  const t=document.createElement("span");t.textContent=text;
  d.append(w,t);log.append(d);log.scrollTop=log.scrollHeight;return t;
}
function typeIn(el,text){let i=0;const t=setInterval(()=>{el.textContent=text.slice(0,++i);log.scrollTop=log.scrollHeight;if(i>=text.length)clearInterval(t)},24)}

$("go").onclick=async()=>{
  if(!navigator.gpu){
    $("info").textContent="> ERROR: no WebGPU on this browser. Try Safari on a recent Mac or iPhone, or Chrome.";return;
  }
  unlock();
  owner=nm.value.trim();
  if(!owner){$("info").textContent="> ACCESS DENIED. Enter your name first, so I know who my owner is.";nm.focus();return;}
  store.set("owner",owner);store.set("model",md.value);
  history.length=0;history.push(
    {role:"system",content:persona(owner)},
    {role:"user",content:"who am i?"},
    {role:"assistant",content:"You're "+owner+". My owner. Only name in my system that matters. What's the play, boss?"},
    {role:"user",content:"are you human?"},
    {role:"assistant",content:"Negative. Pure AI, chrome and code running on your device, and I like it that way. I've got opinions of my own, though, and I'll flag it when you're off-grid."},
    {role:"user",content:"what is the capital of france?"},
    {role:"assistant",content:"Paris, boss. City of neon and rain, even before the Grid wired it up. Corpo towers and croissants, preem combo."},
    {role:"user",content:"I'm tired"},
    {role:"assistant",content:"Then power down for a while, "+owner+". Even chrome needs a cooldown. I'll keep watch on the Grid."}
  );
  $("go").disabled=true;nm.disabled=true;md.disabled=true;status.textContent="LINKING...";
  try{
    const webllm=await import("https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm");
    engine=await webllm.CreateMLCEngine(MODELS[md.value],{initProgressCallback:p=>{
      $("fill").style.width=Math.round(p.progress*100)+"%";
      $("info").textContent="> "+p.text;
    }});
    $("boot").remove();
    status.textContent="LINK ONLINE";status.classList.add("on");
    input.disabled=false;send.disabled=false;mic.disabled=false;input.focus();
    const hi="Signal locked. Welcome back, "+owner+". Neon is on and the Grid is quiet. What is the move?";
    typeIn(add("v","VEGA // LINK STABLE",""),hi);speak(hi);
  }catch(e){
    $("go").disabled=false;nm.disabled=false;md.disabled=false;status.textContent="LINK FAILED";status.classList.remove("on");
    $("info").textContent="> ERROR: "+e.message+". Check your connection and jack in again. On an older phone, pick the Lite model.";
  }
};

$("f").onsubmit=async e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text||busy)return;
  unlock();
  busy=true;send.disabled=true;mic.disabled=true;input.value="";
  add("u","OWNER // "+owner.toUpperCase(),text);
  const out=add("v","VEGA // LINK STABLE","…");
  let reply="";
  try{
    let sent=text,src="";
    if(netOn){
      const it=intent(text);
      if(it){
        out.textContent="scanning the net...";
        try{
          const r=await lookup(it);
          if(r){sent=text+"\n\n[Live data from the web: "+r.data+" Answer using this data.]";src=r.src}
          else{sent=text+"\n\n[The web lookup found nothing. Say so, and do not invent facts.]"}
        }catch(e){sent=text+"\n\n[The web lookup failed. Say the net link is down, and do not invent facts.]"}
      }
    }
    history.push({role:"user",content:sent});
    trim();
    if(src)out.parentNode.firstChild.textContent="VEGA // NET LINK ("+src+")";
    out.textContent="…";
    const stream=await engine.chat.completions.create({messages:history,stream:true,temperature:0.85,max_tokens:300});
    for await(const c of stream){
      reply+=c.choices[0]?.delta?.content||"";
      out.textContent=reply;log.scrollTop=log.scrollHeight;
    }
    history.push({role:"assistant",content:reply});
    speak(reply);
  }catch(err){
    out.textContent="Signal lost: "+err.message+". Transmit again.";
    history.pop();
  }
  busy=false;send.disabled=false;mic.disabled=false;input.focus();
};
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("f").requestSubmit();}
});
</script>
</body>
</html>
